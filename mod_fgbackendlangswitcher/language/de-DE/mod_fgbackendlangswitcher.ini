; mod_fgbackendlangswitcher - de-DE
MOD_FGBACKENDLANGSWITCHER="FG Backend LangSwitcher"
MOD_FGBACKENDLANGSWITCHER_XML_DESCRIPTION="Ermöglicht jedem Administrator, die Backend-Sprache schnell vorübergehend zu wechseln oder dauerhaft im eigenen Profil zu speichern."
MOD_FGBACKENDLANGSWITCHER_FIELD_STYLE_LABEL="Darstellung"
MOD_FGBACKENDLANGSWITCHER_FIELD_STYLE_DESC="„Dropdown“ ist auf das Standard-Admin-Template Atum abgestimmt und wirkt in einem anderen Admin-Template möglicherweise fehl am Platz. „Inline-Liste“ verwendet einfache Bootstrap-Badges und funktioniert überall zuverlässig."
MOD_FGBACKENDLANGSWITCHER_FIELD_STYLE_DROPDOWN="Dropdown"
MOD_FGBACKENDLANGSWITCHER_FIELD_STYLE_INLINE="Inline-Liste"
MOD_FGBACKENDLANGSWITCHER_FIELD_SHOWNATIVE_LABEL="Muttersprachlichen Namen anzeigen"
MOD_FGBACKENDLANGSWITCHER_FIELD_SHOWNATIVE_DESC="Zeigt den Namen der Sprache in der jeweiligen Landessprache (z. B. „Slovenčina“) statt des englischen Namens an."
MOD_FGBACKENDLANGSWITCHER_FIELD_SHOWCODE_LABEL="Sprachcode anzeigen"
MOD_FGBACKENDLANGSWITCHER_FIELD_SHOWDEFAULT_LABEL="Option „Standard“ anzeigen"
MOD_FGBACKENDLANGSWITCHER_FIELD_SHOWDEFAULT_DESC="Fügt eine Option hinzu, um zur Standard-Administratorsprache von Joomla zurückzukehren. Wird angezeigt, wenn eine vorübergehende oder dauerhafte persönliche Sprachauswahl aktiv ist."
MOD_FGBACKENDLANGSWITCHER_SWITCH_LABEL="Administratorsprache wechseln"
MOD_FGBACKENDLANGSWITCHER_DEFAULT_LANGUAGE="Standard (Administrator-Einstellung)"
MOD_FGBACKENDLANGSWITCHER_SWITCHED="Administratorsprache gewechselt zu: %s"
MOD_FGBACKENDLANGSWITCHER_ERROR_NOT_INSTALLED="Die gewünschte Sprache ist für den Administrator nicht installiert."
MOD_FGBACKENDLANGSWITCHER_ERROR_SAVE="Die Spracheinstellung konnte nicht in Ihrem Benutzerprofil gespeichert werden."
MOD_FGBACKENDLANGSWITCHER_ERROR_SAVE_DEBUG="Debug-Detail: %s"
MOD_FGBACKENDLANGSWITCHER_FIELD_ICON_LABEL="Icon-CSS-Klasse"
MOD_FGBACKENDLANGSWITCHER_FIELD_ICON_DESC="Joomla-Icon-Alias (z. B. „icon-language“, „icon-flag“) oder eine Font-Awesome-Klasse (z. B. „fas fa-globe“, „fas fa-earth-europe“)."
MOD_FGBACKENDLANGSWITCHER_FIELD_PERSIST_LABEL="Dauerhaft im Profil speichern"
MOD_FGBACKENDLANGSWITCHER_FIELD_PERSIST_DESC="Wenn deaktiviert (Standard), ist der Wechsel vorübergehend und gilt nur bis zur Abmeldung vom Backend (erfordert, dass das Plugin „System - FG Backend LangSwitcher“ aktiviert ist). Wenn aktiviert, wird die Sprache im Benutzerprofil gespeichert („admin_language“)."
MOD_FGBACKENDLANGSWITCHER_SWITCHED_TEMP="Administratorsprache vorübergehend gewechselt zu: %s (bis zur Abmeldung)"
MOD_FGBACKENDLANGSWITCHER_ERROR_PLUGIN_DISABLED="Der vorübergehende Wechsel erfordert, dass das Plugin „System - FG Backend LangSwitcher“ aktiviert ist."
